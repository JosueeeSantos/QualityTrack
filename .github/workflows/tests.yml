name: QualityTrack - Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe Python
        run: python -m compileall -q app.py

      - name: Testar páginas do QualityTrack
        run: |
          python - <<'PY'
          import app

          app.app.config['TESTING'] = True

          with app.app.test_client() as cliente:
              for pagina in ['/', '/ocorrencias', '/dashboard']:
                  resposta = cliente.get(pagina)
                  print(pagina, resposta.status_code)
                  assert resposta.status_code == 200, (
                      f'Erro ao acessar {pagina}'
                  )

          print('Todos os testes passaram!')
          PY
